ng="1">FINGER LIFTED · PAUSED</text><rect x="16" y="648" width="361" height="72" rx="20" fill="#16161E" /><rect x="16.5" y="648.5" width="360" height="71" rx="19.5" fill="none" stroke="#FF453A" stroke-opacity="0.35"/><circle cx="52" cy="684" r="20" fill="#FF453A" fill-opacity="0.16"/><rect x="46" y="676" width="4" height="16" rx="1.5" fill="#FF453A"/><rect x="54" y="676" width="4" height="16" rx="1.5" fill="#FF453A"/><text x="84" y="679" font-size="16" font-weight="700" fill="#FFFFFF">Finger lifted — measurement paused</text><text x="84" y="700" font-size="13" fill="#8E8E9A">Place your finger back to resume</text><text x="196.5" y="800" font-size="12" fill="#5A5A66" text-anchor="middle">Amber = recoverable · Red = timer paused</text>
