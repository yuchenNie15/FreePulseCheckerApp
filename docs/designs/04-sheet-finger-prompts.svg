<rect width="393" height="852" fill="#0B0B10"/>
<text x="20" y="100" font-size="28" font-weight="700" fill="#FFFFFF">Finger-state prompts</text><text x="20" y="124" font-size="14" fill="#8E8E9A">Banner component · shown above the ring</text><text x="20" y="166" font-size="11" font-weight="700" fill="#5A5A66" letter-spacing="1">PARTIAL COVERAGE</text><rect x="16" y="176" width="361" height="72" rx="20" fill="#16161E" /><rect x="16.5" y="176.5" width="360" height="71" rx="19.5" fill="none" stroke="#FFD60A" stroke-opacity="0.35"/><circle cx="52" cy="212" r="20" fill="#FFD60A" fill-opacity="0.16"/><circle cx="52" cy="212" r="8" fill="none" stroke="#FFD60A" stroke-width="2"/><path d="M52,204 A8,8 0 0 0 52,220 Z" fill="#FFD60A"/><text x="84" y="207" font-size="16" font-weight="700" fill="#FFFFFF">Cover the whole lens</text><text x="84" y="228" font-size="13" fill="#8E8E9A">Part of the camera is still uncovered</text><text x="20" y="284" font-size="11" font-weight="700" fill="#5A5A66" letter-spacing="1">TOO MUCH PRESSURE</text><rect x="16" y="294" width="361" height="72" rx="20" fill="#16161E" /><rect x="16.5" y="294.5" width="360" height="71" rx="19.5" fill="none" stroke="#FFD60A" stroke-opacity="0.35"/><circle cx="52" cy="330" r="20" fill="#FFD60A" fill-opacity="0.16"/><path d="M46,322 L52,328 L58,322 M46,329 L52,335 L58,329" stroke="#FFD60A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="44" y1="339" x2="60" y2="339" stroke="#FFD60A" stroke-width="2.2" stroke-linecap="round"/><text x="84" y="325" font-size="16" font-weight="700" fill="#FFFFFF">Press a little lighter</text><text x="84" y="346" font-size="13" fill="#8E8E9A">Pressing hard squeezes out the pulse</text><text x="20" y="402" font-size="11" font-weight="700" fill="#5A5A66" letter-spacing="1">SATURATED</text><rect x="16" y="412" width="361" height="72" rx="20" fill="#16161E" /><rect x="16.5" y="412.5" width="360" height="71" rx="19.5" fill="none" stroke="#FF9F0A" stroke-opacity="0.35"/><circle cx="52" cy="448" r="20" 