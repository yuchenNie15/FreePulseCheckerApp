#8E8E9A" text-anchor="middle">Rest it gently — don't press. Keep your hand</text><text x="196.5" y="627" font-size="15" font-weight="400" fill="#8E8E9A" text-anchor="middle">steady and stay seated.</text><rect x="96" y="668" width="201" height="40" rx="20" fill="#1F1F2A" stroke="#2E2E3A"/><circle cx="122" cy="688" r="9" fill="#FFD60A" opacity="0.25"/><circle cx="122" cy="688" r="4.5" fill="#FFD60A"/><text x="138" y="694" font-size="16" font-weight="600" fill="#FFFFFF">Waiting for finger</text><text x="196.5" y="800" font-size="12" fill="#5A5A66" text-anchor="middle">Not a medical device</text>
