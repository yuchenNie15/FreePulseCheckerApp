gh)"/><text x="196.5" y="710.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Try Again</text><rect x="20" y="744" width="353" height="52" rx="18" fill="#1F1F2A"/><text x="196.5" y="776.0" font-size="17" font-weight="600" fill="#FF6B9A" text-anchor="middle">Close</text>
